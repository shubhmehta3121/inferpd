# ============================================================
# Prometheus Scrape Configuration
# Scrapes vLLM metrics from prefiller, decoder, and proxy
# ============================================================

global:
  scrape_interval: 5s         # Poll every 5 seconds
  evaluation_interval: 5s
  scrape_timeout: 4s

scrape_configs:

  - job_name: "vllm-prefiller"
    static_configs:
      - targets: ["localhost:8100"]
        labels:
          instance: "prefiller"
          role: "kv_producer"
    metrics_path: /metrics

  - job_name: "vllm-decoder"
    static_configs:
      - targets: ["localhost:8200"]
        labels:
          instance: "decoder"
          role: "kv_consumer"
    metrics_path: /metrics

  - job_name: "proxy"
    static_configs:
      - targets: ["localhost:9000"]
        labels:
          instance: "proxy"
    metrics_path: /metrics

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
